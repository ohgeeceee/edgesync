# EdgeSync nginx snippet — front-end static SPA + reverse-proxy to the
# Node stdlib backend on :8787.  Drop into /etc/nginx/sites-available/
# (or equivalent), then symlink, reload nginx, and `systemctl enable --now
# ops/edgesync.service`.

upstream edgesync_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    server_name edgesync.example.com;

    # ACME challenges go to a dedicated vhost; this one redirects.
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name edgesync.example.com;

    ssl_certificate     /etc/letsencrypt/live/edgesync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgesync.example.com/privkey.pem;

    # Tight ciphers (Mozilla intermediate 2024-ish)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy "no-referrer";

    # Static SPA — the public/ directory is served as-is.  Service
    # Worker must be served same-origin; keep Cache-Control off so the
    # SW's own cache logic controls everything.
    root /opt/edgesync/public;
    index index.html;

    location /api/ {
        # Backend auth: allow only local callers and trusted upstreams.
        # For internet-facing deployments, prefer real auth (see docs/api.md).
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://edgesync_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/";
    }
}
